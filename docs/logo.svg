<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="unbolt logo: a layered gear with its center bolt loosened">
  <!-- outer fine sprocket teeth -->
  <g fill="#B7410E">
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(0 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(15 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(30 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(45 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(60 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(75 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(90 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(105 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(120 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(135 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(150 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(165 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(180 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(195 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(210 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(225 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(240 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(255 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(270 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(285 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(300 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(315 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(330 50 50)" />
    <rect x="48.4" y="4" width="3.2" height="10" transform="rotate(345 50 50)" />
  </g>

  <!-- root ring connecting the fine teeth -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#B7410E" stroke-width="8" />

  <!-- secondary ring of chunky teeth, staggered against the outer ring -->
  <g fill="#B7410E">
    <rect x="45" y="16" width="10" height="13" transform="rotate(22.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(67.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(112.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(157.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(202.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(247.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(292.5 50 50)" />
    <rect x="45" y="16" width="10" height="13" transform="rotate(337.5 50 50)" />
  </g>

  <!-- inner ring connecting the chunky teeth -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#B7410E" stroke-width="7" />

  <!-- hub -->
  <circle cx="50" cy="50" r="13" fill="#2b2b2b" />

  <!-- bolt head, rotated off-grid: loosened -->
  <polygon points="50,40 58.66,45 58.66,55 50,60 41.34,55 41.34,45"
           fill="none" stroke="#f0a858" stroke-width="3"
           transform="rotate(16 50 50)" />
</svg>
