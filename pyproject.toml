[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unbolt"
version = "0.0.1"
description = "Turn COBOL copybooks into a versioned DSL and explainable Go/Java type mappings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Shyam-Sundar-Reddy/unbolt"
Repository = "https://github.com/Shyam-Sundar-Reddy/unbolt"

[tool.hatch.build.targets.wheel]
packages = ["src/unbolt"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]

[tool.mypy]
strict = true
