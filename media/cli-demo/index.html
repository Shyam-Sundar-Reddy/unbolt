<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1016;
        --ink: #f8fafc;
        --accent: #d9822b;
        --font-display: "IBM Plex Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="step1-parse"
        data-composition-id="step1-parse"
        data-composition-src="compositions/step1-parse.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="step2-recommend"
        data-composition-id="step2-recommend"
        data-composition-src="compositions/step2-recommend.html"
        data-start="5"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="step3-generate"
        data-composition-id="step3-generate"
        data-composition-src="compositions/step3-generate.html"
        data-start="12"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="step4-report"
        data-composition-id="step4-report"
        data-composition-src="compositions/step4-report.html"
        data-start="19"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
